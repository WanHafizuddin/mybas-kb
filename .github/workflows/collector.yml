name: Poll live vehicle positions (manual)

# Manual one-off poll into Supabase, for testing.
#
# This used to run on `schedule: */5 * * * *`. GitHub treats schedules as
# best effort and throttled this one to roughly one run every 4-8 hours
# (3-5 polls a day instead of 288), so the live map was empty most of the
# time. Continuous polling now runs on the e2-micro VM as the
# basmy-supabase-collector systemd service (see collector/README.md).
on:
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        working-directory: realtime
      # collector.py imports its fetch/parse logic from the shared basmy
      # package at the repo root.
      - run: pip install -e .
      - run: python collector.py --once
        working-directory: realtime
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
