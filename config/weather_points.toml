# Weather points for the myBAS Kota Bharu network. Each stop gets the weather
# of its nearest point (computed in dbt: int_stop_weather_point), because the
# routes reach up to ~150 km from Kota Bharu and rain is very local.
#
# point_id becomes a join key in the warehouse: never rename one once data
# has been fetched for it; add a new point instead.

[[points]]
point_id = "kota_bharu"
name = "Kota Bharu"
latitude = 6.1254
longitude = 102.2386

