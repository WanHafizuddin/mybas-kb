  <circle cx="42" cy="43" r="3" fill="#facc15"/>
  <!-- Wheels -->
  <rect x="17" y="49" width="8" height="6" rx="2" fill="#0f172a"/>
  <rect x="39" y="49" width="8" height="6" rx="2" fill="#0f172a"/>
